<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <style>
      @keyframes crawlAndEat {
        0% { transform: translateX(1050px); }
        15% { transform: translateX(850px); }
        35% { transform: translateX(710px); }
        55% { transform: translateX(550px); }
        75% { transform: translateX(380px); }
        92% { transform: translateX(180px); }
        100% { transform: translateX(-220px); }
      }
      @keyframes legCrawl {
        0%, 100% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(2deg) scale(1.02); }
      }
      @keyframes eatLetterB2 {
        0%, 18% { opacity: 1; transform: scale(1); }
        22%, 100% { opacity: 0; transform: scale(0.2) translateX(-20px); }
      }
      @keyframes eatLetterI {
        0%, 38% { opacity: 1; transform: scale(1); }
        42%, 100% { opacity: 0; transform: scale(0.2) translateX(-20px); }
      }
      @keyframes eatLetterB1 {
        0%, 58% { opacity: 1; transform: scale(1); }
        62%, 100% { opacity: 0; transform: scale(0.2) translateX(-20px); }
      }
      @keyframes eatLetterA {
        0%, 78% { opacity: 1; transform: scale(1); }
        82%, 100% { opacity: 0; transform: scale(0.2) translateX(-20px); }
      }
      @keyframes eatLetterH {
        0%, 92% { opacity: 1; transform: scale(1); }
        95%, 100% { opacity: 0; transform: scale(0.2) translateX(-20px); }
      }

      .letter {
        font-family: 'Arial Black', Impact, sans-serif;
        font-size: 135px;
        font-weight: 900;
        fill: #FFFFFF;
        transform-origin: center;
      }
      .letter-glow {
        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.3));
      }
      .letter-h { animation: eatLetterH 8s infinite ease-out; }
      .letter-a { animation: eatLetterA 8s infinite ease-out; }
      .letter-b1 { animation: eatLetterB1 8s infinite ease-out; }
      .letter-i { animation: eatLetterI 8s infinite ease-out; }
      .letter-b2 { animation: eatLetterB2 8s infinite linear; }

      .spider-mover {
        animation: crawlAndEat 8s infinite linear;
      }
      .spider-anim {
        animation: legCrawl 0.25s infinite ease-in-out;
        transform-origin: center;
      }
    </style>

    <!-- SILUET SPIDER-MAN SESUAI GAMBAR ANDA (MENGHADAP HORIZONTAL KE KIRI) -->
    <g id="raimi-spider-horizontal">
      <g transform="rotate(-90) translate(-80, -80) scale(0.78)">
        <!-- BADAN TENGAH & KEPALA -->
        <path d="M100,55 C96,65 92,72 90,82 C88,90 92,105 94,115 C96,125 98,140 100,158 C102,140 104,125 106,115 C108,105 112,90 110,82 C108,72 104,65 100,55 Z" fill="#E23636" filter="drop-shadow(0 0 6px #E23636)" />
        <polygon points="100,46 95,54 105,54" fill="#E23636" />
        <polygon points="98,43 95,48 97,48" fill="#E23636" />
        <polygon points="102,43 105,48 103,48" fill="#E23636" />

        <!-- KAKI DEPAN ATAS KIRI -->
        <path d="M96,68 L68,48 L76,16 C76,16 68,36 71,52 L94,74 Z" fill="#E23636" />
        <path d="M93,75 L56,58 L46,24 C46,24 43,48 55,68 L90,82 Z" fill="#E23636" />

        <!-- KAKI BELAKANG BAWAH KIRI (PANJANG MERUNCING) -->
        <path d="M92,86 L48,82 L34,138 C34,138 46,104 59,96 L92,93 Z" fill="#E23636" />
        <path d="M94,97 L72,112 L70,188 C70,188 78,142 85,122 L96,106 Z" fill="#E23636" />

        <!-- KAKI DEPAN ATAS KANAN -->
        <path d="M104,68 L132,48 L124,16 C124,16 132,36 129,52 L106,74 Z" fill="#E23636" />
        <path d="M107,75 L144,58 L154,24 C154,24 157,48 145,68 L110,82 Z" fill="#E23636" />

        <!-- KAKI BELAKANG BAWAH KANAN (PANJANG MERUNCING) -->
        <path d="M108,86 L152,82 L166,138 C166,138 154,104 141,96 L108,93 Z" fill="#E23636" />
        <path d="M106,97 L128,112 L130,188 C130,188 122,142 115,122 L104,106 Z" fill="#E23636" />
      </g>
    </g>
  </defs>

  <!-- BACKGROUND GELAP GITHUB -->
  <rect width="100%" height="100%" fill="#0d1117" rx="14" />
  
  <!-- JARING LABA-LABA HALUS DI SUDUT KIRI -->
  <path d="M0,0 L200,0 M0,0 L0,200 M0,0 L140,140 M0,70 Q70,70 70,0 M0,140 Q140,140 140,0" stroke="#21262d" stroke-width="2" fill="none" opacity="0.6" />

  <!-- HURUF TEKS GEDE: H A B I B -->
  <g class="letter-glow">
    <text x="120" y="165" class="letter letter-h">H</text>
    <text x="270" y="165" class="letter letter-a">A</text>
    <text x="420" y="165" class="letter letter-b1">B</text>
    <text x="570" y="165" class="letter letter-i">I</text>
    <text x="670" y="165" class="letter letter-b2">B</text>
  </g>

  <!-- LABA-LABA MERAYAP HORIZONTAL KE KIRI & MEMAKAN HURUF -->
  <g class="spider-mover">
    <g transform="translate(0, 115)">
      <g class="spider-anim">
        <use href="#raimi-spider-horizontal" />
      </g>
    </g>
  </g>
</svg>
